name: fast_delicious_mobile
description: Application mobile Fast & Delicious — commande, caisse, cuisine, livraison, admin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau
  dio: ^5.4.0                     # client HTTP (équivalent d'axios)
  web_socket_channel: ^2.4.0      # WebSocket temps réel

  # État de l'application
  provider: ^6.1.1                # gestion d'état (équivalent des Context React)

  # Stockage local
  shared_preferences: ^2.2.2      # équivalent de localStorage (tokens JWT)

  # Utilitaires
  intl: ^0.19.0                   # formatage des dates et des montants
  qr_flutter: ^4.1.0              # génération des QR codes (page QR codes staff)
  url_launcher: ^6.2.5            # ouvrir tel:/mailto: (pied de page, contacts)
  fl_chart: ^0.68.0                # graphiques du tableau de bord admin
  share_plus: ^13.0.0              # partage du ticket en texte (WhatsApp, SMS, etc.)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
